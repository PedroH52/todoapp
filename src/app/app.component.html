<div class="main">
    <h1>Mozilla Dev - My To Do List</h1>
    <p class="autores">
      Pedro Henrique Santos Silva — RA: 204483
    </p>

    <div *ngIf="erro" class="erro-msg">
      ⚠️ {{ erro }}
    </div>

    <div *ngIf="carregando" class="carregando-msg">
      ⏳ Carregando tarefas... (pode levar alguns segundos)
    </div>

    <input
      class="lg-text-input"
      #campoNovoItem
      placeholder="Nova tarefa..."
      (keyup.enter)="CREATE_tarefa(campoNovoItem.value); campoNovoItem.value = ''"
    />

    <button
      class="btn-primary"
      (click)="CREATE_tarefa(campoNovoItem.value); campoNovoItem.value = ''">
      Adicionar Tarefa
    </button>

    <ul>
      <li *ngFor="let tarefaDoLoop of arrayDeTarefas">
        <app-item
          [tarefa]="tarefaDoLoop"
          (removerTarefa)="DELETE_tarefa($event)"
          (atualizarTarefa)="UPDATE_tarefa($event.tarefa, $event.novaDescricao)"
          (toggleTarefa)="TOGGLE_tarefa($event)">
        </app-item>
      </li>
    </ul>
  </div>
